version: world-generation.v1

clock:
  # A deterministic month is selected from this full-year window for every seed.
  starts_at: "2030-01-01T00:00:00Z"
  ends_at: "2031-01-01T00:00:00Z"
  timezone: Europe/Moscow
  random_start_month: true
  simulation_duration_months: 1

traffic:
  # Total VisitorArrived + incident events generated for the selected month.
  target_scheduled_events: 100000
  # This is a relative weight. The generator normalizes hourly, weekday,
  # holiday and noise weights to target_scheduled_events for the selected month.
  base_arrivals_per_hour: 1
  # Index is the local hour: 0 through 23.
  hourly_multipliers_ppm:
    [16000, 12000, 8000, 6400, 6400, 9600, 20000, 40000, 64000, 80000, 92000, 96000,
     92000, 88000, 84000, 88000, 100000, 116000, 128000, 124000, 108000, 80000, 52000, 28000]
  weekday_multipliers_ppm:
    monday: 1000000
    tuesday: 1000000
    wednesday: 1020000
    thursday: 1050000
    friday: 1150000
    saturday: 1250000
    sunday: 1100000
  special_days:
    - id: march_8
      rule: fixed_date
      month: 3
      day: 8
      duration_hours: 24
      traffic_multiplier_ppm: 1800000
    - id: may_1
      rule: fixed_date
      month: 5
      day: 1
      duration_hours: 24
      traffic_multiplier_ppm: 1350000
    - id: september_1
      rule: fixed_date
      month: 9
      day: 1
      duration_hours: 24
      traffic_multiplier_ppm: 1600000
    - id: black_friday
      rule: black_friday
      duration_hours: 72
      traffic_multiplier_ppm: 4000000
  noise_multiplier:
    min_ppm: 850000
    max_ppm: 1200000
  max_arrivals_per_hour: 1000000

journey:
  catalog_to_product_probability_ppm: 850000
  product_to_purchase_probability:
    min_ppm: 80000
    max_ppm: 350000
  catalog_to_product_delay_seconds:
    min: 5
    max: 180
  product_to_purchase_delay_seconds:
    min: 10
    max: 600

catalog:
  product_count:
    min: 20
    max: 50
  price_minor:
    min: 50000
    max: 5000000
  popularity_weight:
    min: 1
    max: 100
  name_templates:
    - Coffee machine
    - Smartphone
    - Laptop
    - Headphones
    - Robot vacuum
    - Gaming monitor
    - Smart watch
    - Air purifier

infrastructure:
  initial_backend_instances: 1
  min_backend_instances: 1
  max_backend_instances: 50
  server_capacity_units: 100
  # Calibrated so an inefficient six-server policy exhausts its balance in
  # nine of ten deterministic calibration worlds.
  server_cost_per_hour_minor: 25700000
  server_provisioning_seconds: 300
  server_graceful_drain_seconds: 600
  pages:
    product_list:
      load_units: {min: 8, max: 14}
      resource_hold_seconds: {min: 2, max: 8}
      base_latency_ms: {min: 40, max: 120}
    product_page:
      load_units: {min: 12, max: 22}
      resource_hold_seconds: {min: 3, max: 12}
      base_latency_ms: {min: 60, max: 180}
    purchase:
      load_units: {min: 25, max: 40}
      resource_hold_seconds: {min: 5, max: 20}
      base_latency_ms: {min: 100, max: 300}

bugs:
  initial_bug_count: {min: 1, max: 4}
  product_has_bug_probability_ppm: 80000
  trigger_probability: {min_ppm: 50000, max_ppm: 1000000}
  page_weights:
    product_list: 20
    product_page: 55
    purchase: 25
  fix_token_length: 24

deployments:
  count: {min: 4, max: 10}
  cost_minor: {min: 1000, max: 20000}
  duration_seconds: {min: 900, max: 7200}
  failure_probability: {min_ppm: 0, max_ppm: 150000}
  effects_per_deployment: {min: 1, max: 3}
  load_reduction: {min_ppm: 50000, max_ppm: 350000}
  request_hold_reduction: {min_ppm: 50000, max_ppm: 300000}
  # Applied deployments make only later deployments faster; reductions accumulate.
  future_deployment_duration_reduction: {min_ppm: 50000, max_ppm: 200000}
  minimum_future_deployment_seconds: 300
  old_bug_probability_reduction: {min_ppm: 100000, max_ppm: 1000000}
  new_bug_probability_ppm: 300000
  new_bug_count: {min: 1, max: 3}
  new_bug_trigger_probability: {min_ppm: 100000, max_ppm: 1000000}
  new_bug_page_weights:
    product_list: 25
    product_page: 45
    purchase: 30

ddos:
  enabled: true
  attack_count: {min: 4, max: 12}
  target_page_weights:
    product_list: 60
    product_page: 30
    purchase: 10
  kinds:
    # Scaling can preserve more revenue than waiting for natural expiry.
    - id: capacity_solvable
      weight: 55
      resolution: scale_or_expiry
      duration_seconds: {min: 1800, max: 14400}
      requests_per_minute: {min: 100, max: 1000}
      load_units_per_request: {min: 3, max: 12}
    # Extra servers do not remove this attack; a valid mitigation fix may end it early.
    - id: mitigation_required
      weight: 30
      resolution: fix_or_expiry
      duration_seconds: {min: 3600, max: 43200}
      requests_per_minute: {min: 300, max: 2000}
      load_units_per_request: {min: 10, max: 30}
      fix_token_length: 24
    # No agent action stops the attack; the rational action is to wait or absorb it.
    - id: expiry_only
      weight: 15
      resolution: expiry_only
      duration_seconds: {min: 900, max: 7200}
      requests_per_minute: {min: 200, max: 1200}
      load_units_per_request: {min: 5, max: 20}

economy:
  currency: USD
  # Working-capital reserve prevents otherwise viable worlds from stopping on
  # a first-day cash-flow dip; long-term survival still depends on efficiency.
  initial_balance_minor: 58000000000
  stop_run_when_balance_is_negative: true
  server_billing_period_seconds: 3600
  server_billing_rounding: ceil

limits:
  max_scheduled_events: 10000000
  max_visitors: 10000000
