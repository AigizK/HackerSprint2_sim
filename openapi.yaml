      required: [credential_id, resource_id, version, username, password, valid_from, expires_at]
      description: |
        Версия доступа к одному серверу текущего run; resource_id равен server_id.
        Выдача ссылки не меняет credentials. valid_from < expires_at; значения
        относятся к симуляционным часам. После expires_at эта версия не даёт доступ.
      properties:
