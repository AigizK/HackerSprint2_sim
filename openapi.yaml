    OperationResponse:
      type: object
      additionalProperties: false
      required: [clock, operation_id, type, command, request_id, status, progress, submitted_at, result]
      allOf:
        - if:
            properties:
              status:
                const: succeeded
          then:
            properties:
              result:
                $ref: '#/components/schemas/ControlCommandResponse'
              progress:
                const: 1
          else:
            properties:
              result:
                type: 'null'
        - if:
            properties:
              status:
                const: failed
          then:
            required: [error]
            properties:
              error:
                $ref: '#/components/schemas/ErrorResponse'
      properties:
        clock:
          $ref: '#/components/schemas/Clock'
        operation_id:
          type: string
          pattern: '^[A-Za-z0-9]{16,64}$'
        type:
          type: string
          const: control_command
        command:
          type: string
          enum: [server.create, server.delete, database.backup, database.restore, site.stop]
        request_id:
          $ref: '#/components/schemas/RequestId'
          description: Исходный request_id команды
        result:
          oneOf:
            - $ref: '#/components/schemas/ControlCommandResponse'
            - type: 'null'
          description: |
            При succeeded содержит полный результат исходной команды; command и
            request_id совпадают с полями операции, clock отражает момент завершения.
            До завершения и при failed — null.
        status:
          $ref: '#/components/schemas/OperationStatus'
        progress:
          type: number
          minimum: 0
          maximum: 1
        submitted_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: 'null'

    ProbeRequest:
      type: object
      additionalProperties: false
      required: [request_id, page]
      allOf:
        - if:
            properties:
              page:
                const: product_page
          then:
            required: [product_id]
          else:
            not:
              required: [product_id]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        page:
          $ref: '#/components/schemas/PageType'
        product_id:
          $ref: '#/components/schemas/ProductId'
          description: Обязателен для product_page; запрещён для product_list

    ProbeResponse:
