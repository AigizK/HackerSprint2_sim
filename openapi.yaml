      additionalProperties: false
      required: [name, role, instance_type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '\S'
          description: Отображаемое непустое имя; идентификатор server_id назначает симулятор
        role:
          $ref: '#/components/schemas/ServerRole'
        instance_type:
          $ref: '#/components/schemas/ResourceId'
          description: Тип из server.types.list с соответствующей ролью; не произвольная мощность
          examples: [backend.standard, db.large]

    ServerIdParams:
      type: object
      additionalProperties: false
      required: [server_id]
      properties:
        server_id:
          $ref: '#/components/schemas/ResourceId'

    DatabaseCreateParams:
      type: object
      additionalProperties: false
      required: [server_id, name]
      properties:
        server_id:
          $ref: '#/components/schemas/ResourceId'
          description: Активный сервер роли database
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '\S'
          description: Имя БД; database_id назначает симулятор

    DatabaseIdParams:
      type: object
      additionalProperties: false
      required: [database_id]
      properties:
        database_id:
          $ref: '#/components/schemas/ResourceId'

    DatabaseBackupsListParams:
      type: object
      additionalProperties: false
      properties:
