          $ref: '#/components/schemas/ResourceId'
          description: Фильтр по исходной БД; допустим ID уже удалённой БД с сохранёнными бэкапами

    DatabaseRestoreParams:
      type: object
      additionalProperties: false
      required: [database_id, backup_id]
      properties:
