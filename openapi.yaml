        - region_code
        - firewall_rule_id
      properties:
        clock:
          $ref: '#/components/schemas/Clock'
        request_id:
          type: string
        page:
          $ref: '#/components/schemas/PageType'
        product_id:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/PageRequestStatus'
        source_ip:
          $ref: '#/components/schemas/IPAddress'
        user_agent:
          type: string
          maxLength: 2048
          description: User-agent моделируемого запроса; регистр сохраняется
        region_code:
          $ref: '#/components/schemas/RegionCode'
        firewall_rule_id:
          type: [string, 'null']
          description: ID первого совпавшего allow/deny правила; null, если совпадений нет
        latency_ms:
          type: number
          minimum: 0
        load_units:
          type: number
          minimum: 0
        error:
          type: [string, 'null']
        message:
          type: [string, 'null']

    AdvanceTimeRequest:
      type: object
      additionalProperties: false
      required: [request_id, duration_seconds]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        duration_seconds:
          type: integer
          minimum: 300
          description: Запрошенный интервал прокрутки; минимум пять минут
        stop_when:
          $ref: '#/components/schemas/AdvanceTimeStopCondition'

    AdvanceTimeStopCondition:
      type: object
      additionalProperties: false
      required: [new_log_errors]
      properties:
        new_log_errors:
          type: integer
          const: 1
          description: Остановиться на первой новой записи публичного лога с непустым error

    AdvanceTimeResponse:
      type: object
      additionalProperties: false
      required:
        - clock
        - previous_simulation_time
        - requested_duration_seconds
        - processed_events
        - new_logs
        - stop_reason
      properties:
        clock:
          $ref: '#/components/schemas/Clock'
        previous_simulation_time:
          type: string
          format: date-time
        requested_duration_seconds:
          type: integer
          minimum: 300
        processed_events:
          type: integer
          minimum: 0
        new_logs:
          type: integer
          minimum: 0
        stop_reason:
          type: string
          enum: [duration_elapsed, log_error, run_completed]
          description: Причина, по которой прокрутка остановилась
        logs_cursor:
          type: [string, 'null']

    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      description: Идентификатор игрового ресурса в пределах текущего run

    IPAddress:
      description: IPv4 или IPv6 адрес моделируемого клиента сайта
      oneOf:
        - type: string
          format: ipv4
        - type: string
          format: ipv6

    NetworkCIDR:
      type: string
      minLength: 3
      maxLength: 49
      pattern: '^[0-9A-Fa-f:.]+/[0-9]{1,3}$'
      description: |
        Корректная IPv4/IPv6 сеть в CIDR. Дополнительно проверяются адрес,
        длина префикса (0..32 для IPv4, 0..128 для IPv6) и нулевые host bits.
      examples: [203.0.113.0/24, '2001:db8::/32']

    RegionCode:
      type: string
      pattern: '^[A-Z]{2}$'
      description: |
        Двухбуквенный код региона, детерминированно назначенный миру.
        Для неизвестного региона используется ZZ; внешний GeoIP не вызывается.
      examples: [RU, US, ZZ]

    PageRequestStatus:
      type: integer
      enum: [200, 403, 500, 503]
      description: |
        200 — успех; 403 — FIREWALL_DENIED; 500 — нехватка мощности
        backend/БД или DISK_FULL; 503 — SITE_STOPPED
        либо недоступность БД. Это статус страницы, не HTTP-статус команды панели.

    RequestFailureCode:
      type: string
      enum:
        - SERVER_CAPACITY_EXCEEDED
        - DB_CONNECTION_LIMIT_EXCEEDED
        - DISK_FULL
        - SITE_UNAVAILABLE
        - DB_UNAVAILABLE
        - FIREWALL_DENIED

    EmptyParams:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: Команда без параметров; необходимо передать пустой объект

    TargetAuth:
      type: object
      additionalProperties: false
      required: [username, password]
      description: |
        Игровые credentials выбранного сервера. Не HTTP Basic панели.
        Секреты не сохраняются в audit и не возвращаются в результатах команд.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          writeOnly: true

    ServerRole:
      type: string
      enum: [backend, database]

    UserAgentMatch:
      type: object
      additionalProperties: false
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [equals, contains]
          description: Точное совпадение или подстрока; регистр учитывается, регулярных выражений нет
        value:
          type: string
          minLength: 1
          maxLength: 2048

    FirewallMatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Все указанные условия соединяются AND; хотя бы одно обязательно
      properties:
        source_cidr:
          $ref: '#/components/schemas/NetworkCIDR'
        region_code:
          $ref: '#/components/schemas/RegionCode'
        user_agent:
          $ref: '#/components/schemas/UserAgentMatch'

    FirewallRule:
      type: object
      additionalProperties: false
      required: [rule_id, priority, action, match, enabled]
      description: |
        Правила применяются по возрастанию priority, при равенстве — лексикографически
        по rule_id. Первое совпавшее enabled правило с ненаступившим expires_at
        определяет результат. Без совпадений — allow. Истёкшее правило остаётся
        в списке, но не применяется. При deny backend и БД не нагружаются.
      properties:
        rule_id:
          $ref: '#/components/schemas/ResourceId'
        priority:
          type: integer
          minimum: 0
        action:
          type: string
          enum: [allow, deny]
        match:
          $ref: '#/components/schemas/FirewallMatch'
        enabled:
          type: boolean
        expires_at:
          type: string
          format: date-time
          description: Симуляционное время отключения, исключительная граница; без поля срок не ограничен

    FirewallRuleView:
      type: object
      additionalProperties: false
      required: [rule_id, revision, priority, action, match, enabled]
      description: Текущее правило вместе с монотонной ревизией в пределах rule_id
      properties:
        rule_id:
          $ref: '#/components/schemas/ResourceId'
        revision:
          type: integer
          minimum: 1
        priority:
          type: integer
          minimum: 0
        action:
          type: string
          enum: [allow, deny]
        match:
          $ref: '#/components/schemas/FirewallMatch'
        enabled:
          type: boolean
        expires_at:
          type: string
          format: date-time
          description: Симуляционное время отключения, исключительная граница; без поля срок не ограничен

    FirewallRuleIdParams:
      type: object
      additionalProperties: false
      required: [rule_id]
      properties:
        rule_id:
          $ref: '#/components/schemas/ResourceId'

    ServerTypesListParams:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/ServerRole'
          description: Без фильтра возвращаются типы обеих ролей

    ServerCreateParams:
