        expected_current_database_id:
          $ref: '#/components/schemas/ResourceId'
          description: Ожидаемый текущий ID из site.config.get; проверяется атомарно

    ServerType:
      type: object
      additionalProperties: false
      required: [instance_type, role, capacity_units, disk_bytes, connection_limit, connection_hold_ms, cost_per_hour_minor, cost_per_month_minor, provisioning_seconds]
      properties:
        instance_type:
          $ref: '#/components/schemas/ResourceId'
        role:
          $ref: '#/components/schemas/ServerRole'
        capacity_units:
          type: number
          exclusiveMinimum: 0
          description: Пропускная способность для данной роли; backend и БД учитываются раздельно
        disk_bytes:
          type: integer
          minimum: 1
        connection_limit:
          type: integer
          minimum: 0
          description: Для database — 100/200/400; для backend — 0
        connection_hold_ms:
          type: integer
          minimum: 0
          description: Для database каждое соединение занято 100 мс; для backend — 0
        cost_per_hour_minor:
          type: integer
          minimum: 0
        cost_per_month_minor:
          type: integer
          minimum: 0
          description: Месячный тариф типа; для почасового backend — 0
        provisioning_seconds:
          type: number
          minimum: 0
          description: Длительность подготовки по симуляционному времени

    DiskUsage:
      type: object
      additionalProperties: false
      required: [server_id, total_bytes, system_bytes, database_bytes, logs_bytes, used_bytes, free_bytes, cleanable_bytes]
      description: |
        used_bytes = system_bytes + database_bytes + logs_bytes <= total_bytes;
        free_bytes = total_bytes - used_bytes; cleanable_bytes = logs_bytes.
        События заполнения увеличивают logs_bytes только до исчерпания свободного
        места. Дальнейшие записи при полном диске не увеличивают счётчик.
        У backend database_bytes равен 0. Очистка не изменяет system_bytes и database_bytes.
      properties:
        server_id:
          $ref: '#/components/schemas/ResourceId'
        total_bytes:
          type: integer
          minimum: 1
        system_bytes:
          type: integer
          minimum: 0
        database_bytes:
          type: integer
          minimum: 0
        logs_bytes:
          type: integer
          minimum: 0
        used_bytes:
          type: integer
          minimum: 0
        free_bytes:
          type: integer
          minimum: 0
        cleanable_bytes:
          type: integer
          minimum: 0

