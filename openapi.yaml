        size_bytes:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        storage_cost_per_hour_minor:
          type: integer
          minimum: 0
          description: Стоимость хранения готового бэкапа за симуляционный час

