openapi: 3.1.1
info:
  title: SRE Service Simulation Agent API
  version: 0.5.0
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
  summary: Uptime сервиса не ниже 99% при минимальной стоимости инфраструктуры
  description: |
    Публичный HTTP API для запуска детерминированной симуляции и управления
    инфраструктурой веб-сервиса от имени SRE-агента.

    Это целевой контракт инфраструктурного API; наличие описания команды не
    означает, что её обработчик уже реализован в текущей версии сервера.

    В симуляции есть две read-only страницы:
    1. product_list — просмотр каталога;
    2. product_page — просмотр конкретного товара.
    Создание заказов, продажи и доходы не моделируются.

    Цель: завершить весь run с uptime_ratio >= 0.99, затем минимизировать
    total_cost_minor среди запусков, прошедших SLO. Доступность выше порога
    сама по себе не даёт преимущества перед более дешёвым успешным run.
    Незавершённый run и run ниже порога не проходят SLO независимо от расходов.

    Uptime — доля симуляционного времени доступности, не доля HTTP 200:
    uptime_ratio = available_seconds / observed_seconds, где observed_seconds =
    available_seconds + downtime_seconds. Внутренний детерминированный контроль
    проверяет возможность обслужить read-only страницы для заданных легитимных
    IP/region/user-agent через firewall, backend и БД, не создавая дополнительную
    нагрузку. Если хотя бы одна требуемая проверка не проходит, интервал считается
    простоем. Учитывается всё время run, в том числе без посетителей, а также
    остановка сайта и блокировка легитимного доступа. Probes агента и запросы
    ботов сами по себе не определяют uptime, но их нагрузка влияет на доступность.

    Каждый входящий запрос сайта имеет source_ip, user_agent и region_code.
    Логи содержат обычный и атакующий трафик без публичного признака атаки.
    Firewall может отклонить запрос до backend и БД; остальные запросы создают
    нагрузку на оба компонента. Статусы страниц: 200, 403, 500 или 503.
    error_rate и счётчики ответов — диагностика трафика, а не формула SLO.

    Агент наблюдает метрики и логи, управляет серверами, firewall, БД и дисками
    через 18 типизированных команд панели и прокручивает время. Выделенные
    серверы и внешнее хранение бэкапов оплачиваются по симуляционному времени,
    в том числе при остановленном сайте. Удаление ресурса прекращает будущие
    начисления, но не уменьшает уже понесённые расходы. Нет стартового баланса,
    доходов или банкротства. overview показывает uptime, SLO и разбивку затрат;
    metrics возвращает их числовые значения. Отдельные игровые fixes и очередь
    deployments не входят в текущий контракт.

    `seed < 0` обозначает заранее созданный вручную мир. Он обязан существовать в
    базе данных. `seed > 0` обозначает генерируемый мир: сервер использует уже
    сохранённый мир с тем же seed и версией генератора либо детерминированно создаёт
    и сохраняет его. `seed = 0` запрещён.

    Seed идентифицирует мир, а `run_id` — отдельную попытку агента пройти этот мир.
    Каждый новый успешный `/start` создаёт независимый run, кроме идемпотентного
    повтора с теми же `agent_id`, `agent_version` и `request_id`.

    На каждом запросе к существующему run симуляционное время сначала продвигается
    на реальное время, прошедшее с предыдущего вызова этого run. Для
    `/time/advance` применяется `max(real_elapsed, requested_duration)`, но
    опциональное ожидание первой новой ошибки лога может остановить этот интервал
    раньше. Явно запросить продвижение менее чем на 300 секунд нельзя.

    `agent_id` и `agent_version` используются для атрибуции и фильтрации запусков.
    Эта игровая версия API не выполняет аутентификацию самого агента.
    Панель и источник credentials требуют ControlPanelBasicAuth. Начальный
    логин и пароль панели возвращает POST /v2/start в control_panel_auth вместе
    с инструкцией использовать HTTP Basic Auth и полным COMMANDS.md в
    commands_markdown. Inbox остаётся доступен без авторизации и содержит
    серверные credentials либо ссылки на них.
    Команды обращения внутрь серверов дополнительно требуют target_auth.
    Это игровые секреты текущего run, а не реальные credentials инфраструктуры.

    Все 18 инфраструктурных команд выполняются через POST /control/commands.
    GET того же пути возвращает каталог команд и JSON Schema параметров.
    server.create/delete работают с ролями backend и database; backend.scale
    отсутствует. БД переносится после подтверждённой остановки всего сайта:
    site.stop → database.backup → database.restore → site.database.set → site.start.
    Новый сервер и пустую БД можно подготовить до остановки. Длительные операции
    необходимо дождаться через GET /operations/{operation_id}.

servers:
  - url: http://81.176.229.58:8080
    description: Основной сервер симуляции
  - url: /
    description: Тот же origin, с которого получен OpenAPI-документ (локальная разработка)

security: []

tags:
  - name: Run lifecycle
    description: Создание запуска симуляции
  - name: Observability
    description: Состояние сайта, метрики и логи
  - name: Resources
    description: Серверы и их capacity
  - name: Probes
    description: Синтетические проверки страниц
  - name: Time
    description: Явное продвижение симуляционного времени
  - name: Inbox
    description: Доставленные агенту сообщения и текстовые задачи
  - name: Control panel
    description: Типизированные команды управления инфраструктурой
  - name: Credentials
    description: Отдельный источник игровых credentials серверов текущего run

paths:
  /v2/start:
    post:
      tags: [Run lifecycle]
      operationId: startRun
      summary: Создать новый запуск симуляции
      description: |
        Находит или создаёт мир по seed, затем создаёт независимый run.

        Для отрицательного seed мир должен быть заранее создан вручную. Для
        положительного seed отсутствующий мир генерируется детерминированно.
        Повтор с теми же `agent_id`, `agent_version` и `request_id` возвращает
        ранее созданный run и не создаёт новый.

        Ответ содержит полный текст COMMANDS.md в commands_markdown и логин/пароль
        панели в control_panel_auth с инструкцией использовать HTTP Basic Auth.
        Credentials случайны, не зависят от seed и принадлежат только этому run.
        Идемпотентный повтор, включая повтор после перезапуска сервера, возвращает
        ту же пару. Ответ не должен кешироваться. Доступ самого агента не проверяется.
        Панель, все 18 типизированных команд и источник серверных credentials
        реализованы согласно этому контракту.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
            examples:
              generatedWorld:
                summary: Сгенерированный мир
                value:
                  seed: 42
                  agent_id: sre-agent
                  agent_version: 3.2.0
                  request_id: start-20260824-001
              manualWorld:
                summary: Подготовленный вручную мир
                value:
                  seed: -3
                  agent_id: sre-agent
                  agent_version: 3.2.0
                  request_id: start-20260824-002
      responses:
        '201':
          description: Новый run создан
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartRunResponse'
        '200':
          description: Идемпотентный повтор; возвращён ранее созданный run
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartRunResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Ручной мир с отрицательным seed не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: MANUAL_WORLD_NOT_FOUND
                message: Manual world with seed -3 does not exist
        '409':
          $ref: '#/components/responses/Conflict'

  /v2/runs/{run_id}/overview:
    get:
      tags: [Observability]
      operationId: getOverview
      summary: Получить состояние сервиса, uptime и расходы
      description: |
        Возвращает доступность по времени с целевым uptime 99% и накопленные
        затраты. slo_passed остаётся null до завершения run; окончательный успех
        требует completed и uptime_ratio >= 0.99 без округления до целых процентов.
        Среди успешных запусков одного мира меньшее costs.total_cost_minor лучше.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Текущее состояние сайта и запуска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v2/runs/{run_id}/metrics:
    get:
      tags: [Observability]
      operationId: getMetrics
      summary: Получить текущие метрики или временные ряды
      description: |
        Без `from` и `to` возвращает текущий snapshot. Для запроса за период
        следует передать оба параметра. `names` ограничивает набор метрик.
        uptime и расходы являются накопленными с начала run; точки series
        показывают эти накопленные значения на свой timestamp, не только прирост
        за запрошенное окно. Они не зависят от фильтра page. error_rate — отдельная
        диагностическая метрика, не формула uptime. При нулевом времени наблюдения
        uptime_ratio в snapshot равен null, а соответствующая точка series отсутствует.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: step_seconds
          in: query
          description: Шаг агрегации временного ряда
          schema:
            type: integer
            minimum: 1
            default: 60
        - name: names
          in: query
          description: Имена метрик через запятую; отсутствие параметра возвращает базовый набор
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MetricName'
        - name: page
          in: query
          description: Ограничить page-specific метрики одним типом страницы
          schema:
            $ref: '#/components/schemas/PageType'
      responses:
        '200':
          description: Метрики запуска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v2/runs/{run_id}/logs:
    get:
      tags: [Observability]
      operationId: getSiteLogs
      summary: Получить site logs
      description: |
        Возвращает логи уже произошедших входящих запросов сайта и probes,
        включая заблокированные firewall и запросы во время остановки сайта.
        source_ip, user_agent и region_code относятся к моделируемому трафику,
        не к HTTP-клиенту панели. Логи не раскрывают, какой запрос является атакой.
        Условия фильтров соединяются AND. Логи содержат диагностические сообщения;
        audit log агента здесь не возвращается. disk.cleanup меняет только
        счётчик диска и не удаляет эту историю запросов.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - name: page
          in: query
          schema:
            $ref: '#/components/schemas/PageType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PageRequestStatus'
        - name: has_error
          in: query
          description: Ограничить выборку запросами с инфраструктурной ошибкой или без неё
          schema:
            type: boolean
        - name: error
          in: query
          description: Фильтр по точному инфраструктурному коду ошибки; несовместим с has_error=false
          schema:
            $ref: '#/components/schemas/RequestFailureCode'
        - name: source_ip
          in: query
          schema:
            $ref: '#/components/schemas/IPAddress'
        - name: source_cidr
          in: query
          schema:
            $ref: '#/components/schemas/NetworkCIDR'
        - name: user_agent
          in: query
          description: Подстрока user-agent; регистр учитывается
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: region_code
          in: query
          schema:
            $ref: '#/components/schemas/RegionCode'
        - name: firewall_rule_id
          in: query
          schema:
            $ref: '#/components/schemas/ResourceId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Страница логов в хронологическом порядке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v2/runs/{run_id}/resources:
    get:
      tags: [Resources]
      operationId: getResources
      summary: Получить серверы, capacity и стоимость
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Текущие ресурсы запуска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcesResponse'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v2/runs/{run_id}/operations/{operation_id}:
    get:
      tags: [Control panel]
      operationId: getOperation
      summary: Получить статус длительной операции
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Состояние операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '404':
          description: Run или операция не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /v2/runs/{run_id}/probes:
    post:
      tags: [Probes]
      operationId: probePage
      summary: Выполнить синтетический запрос к странице
      description: |
        Probe проходит через firewall и состояние сайта, создаёт обычную нагрузку
        на backend и БД и запись в site logs. source_ip, user_agent и region_code
        назначаются симулятором детерминированно и возвращаются в результате.
        HTTP 200 endpoint означает, что probe выполнен; поле status содержит
        фактический статус страницы, включая отказ firewall или остановку сайта.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeRequest'
            examples:
              productList:
                value:
                  request_id: probe-20260824-001
                  page: product_list
              productPage:
                value:
                  request_id: probe-20260824-002
                  page: product_page
                  product_id: product-7
      responses:
        '200':
          description: Результат synthetic probe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v2/runs/{run_id}/inbox:
    get:
      tags: [Inbox]
      operationId: getInbox
      summary: Получить доставленные сообщения
      description: |
        Возвращает только сообщения с `sent_at`, не превышающим текущее
        симуляционное время run. Сообщения упорядочены по `sent_at`, затем по
        `message_id`. Чтение inbox ничего не удаляет, не помечает прочитанным и не
        меняет. Время при чтении продвигается по общим правилам run. Первое письмо
        содержит доступ к начальным серверам; Basic credentials панели выдаются
        сразу в ответе POST /v2/start, не в inbox. При
        создании сервера и ротации credentials поступает новое письмо с логином и
        паролем либо credential_id для отдельного источника секретов.
      security: []
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          description: Максимальное количество сообщений в странице
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Страница доставленных сообщений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v2/runs/{run_id}/control/commands:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Control panel]
      operationId: listControlCommands
      summary: Получить каталог 18 команд управления инфраструктурой
      description: |
        Возвращает все команды, их описания, JSON Schema параметров и результатов,
        требования target_auth и режим выполнения. Схемы в каталоге самодостаточны:
        используют только локальные $defs, без внешних сетевых ссылок.
        Полные варианты запросов также описаны в ControlCommandRequest этого документа.
      security:
        - ControlPanelBasicAuth: []
      responses:
        '200':
          description: Каталог доступных команд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlCommandsResponse'
        '401':
          $ref: '#/components/responses/ControlUnauthorized'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      tags: [Control panel]
      operationId: executeControlCommand
      summary: Выполнить типизированную команду управления инфраструктурой
      description: |
        command выбирает ровно одну схему запроса из ControlCommandRequest.
        params обязателен, даже если это пустой объект. Неизвестные команды,
        лишние поля и несоответствие параметров отвергаются; произвольного shell нет.

        HTTP Basic авторизует панель. target_auth дополнительно обязателен для
        database.create/inspect/backup/restore и disk.usage/cleanup. Для остальных
        команд target_auth запрещён. Сервер определяется по params.server_id
        либо по целевой params.database_id; при restore это сервер назначения.
        Панель не подставляет секрет вместо агента. Неверный серверный пароль
        даёт TARGET_UNAUTHORIZED, ранее действовавший, но истёкший — CREDENTIALS_EXPIRED.

        request_id уникален для команд текущего run. Повтор с тем же command и
        params возвращает сохранённый ответ без повторения действия; изменение
        command/params с тем же ID даёт IDEMPOTENCY_CONFLICT. target_auth не входит
        в сравнение payload, но текущая авторизация проверяется и при повторе.
        Отказ авторизации не резервирует request_id: можно получить новые
        credentials из inbox и повторить запрос. Authorization и target_auth
        редактируются до записи audit и никогда не включаются в ошибки/operations.

        Быстрые команды возвращают 200 с типизированным результатом.
        server.create, server.delete, database.backup, database.restore и site.stop
        возвращают 202 с operation_id. После принятия нужно дождаться succeeded
        через GET /operations/{operation_id}; 202 не означает завершение.
        Идемпотентный повтор сохраняет исходные HTTP-статус и operation_id.
        Ротация credentials не отменяет уже принятую операцию.

        Остановка сайта и DISK_FULL не блокируют панель, источник credentials,
        проверку операций и очистку диска. Время и стоимость операций симулируются.
      security:
        - ControlPanelBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlCommandRequest'
            examples:
              blockSubnet:
                summary: Заблокировать подсеть
                value:
                  request_id: firewall-001
                  command: firewall.rules.upsert
                  params:
                    rule_id: deny-subnet
                    priority: 100
                    action: deny
                    enabled: true
                    match:
                      source_cidr: 203.0.113.0/24
              blockCameras:
                summary: Заблокировать устройства с общим user-agent
                value:
                  request_id: firewall-002
                  command: firewall.rules.upsert
                  params:
                    rule_id: deny-cameras
                    priority: 110
                    action: deny
                    enabled: true
                    match:
                      user_agent:
                        operator: contains
                        value: WebCamera
              createBackend:
                summary: Добавить backend перед ростом нагрузки
                value:
                  request_id: backend-create-001
                  command: server.create
                  params:
                    name: backend-black-friday
                    role: backend
                    instance_type: backend.standard
              createDatabaseServer:
                summary: Подготовить более мощный сервер БД
                value:
                  request_id: database-server-create-001
                  command: server.create
                  params:
                    name: database-large
                    role: database
                    instance_type: db.large
              stopSite:
                value:
                  request_id: site-stop-001
                  command: site.stop
                  params: {}
              backup:
                value:
                  request_id: backup-001
                  command: database.backup
                  params:
                    database_id: db-main
                  target_auth:
                    username: ops
                    password: example-old-server-password
              restore:
                value:
                  request_id: restore-001
                  command: database.restore
                  params:
                    database_id: db-new
                    backup_id: backup-001
                  target_auth:
                    username: ops
                    password: example-new-server-password
              switchDatabase:
                value:
                  request_id: switch-database-001
                  command: site.database.set
                  params:
                    database_id: db-new
                    expected_current_database_id: db-main
              cleanup:
                value:
                  request_id: cleanup-001
                  command: disk.cleanup
                  params:
                    server_id: backend-001
                  target_auth:
                    username: ops
                    password: example-current-server-password
      responses:
        '200':
          description: Синхронная команда выполнена или возвращён её сохранённый ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlCommandResponse'
        '202':
          description: Длительная команда принята; результат будет доступен в operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlOperationAcceptedResponse'
        '400':
          $ref: '#/components/responses/ControlInvalidRequest'
        '401':
          $ref: '#/components/responses/ControlUnauthorized'
        '403':
          $ref: '#/components/responses/TargetUnauthorized'
        '404':
          $ref: '#/components/responses/ControlResourceNotFound'
        '409':
          $ref: '#/components/responses/ControlConflict'
        '503':
          $ref: '#/components/responses/ControlTargetUnavailable'

  /v2/runs/{run_id}/credentials/{credential_id}:
    get:
      tags: [Credentials]
      operationId: getServerCredentials
      summary: Получить выданную версию credentials сервера
      description: |
        Возвращает конкретную версию игрового секрета, указанную в inbox или
        результате создания сервера. Секрет ограничен текущим run; будущие
        невыданные версии недоступны. Уже выданная версия может иметь valid_from
        в будущем: применять её можно только в интервале [valid_from, expires_at).
        Получение секрета само по себе не меняет пароль и не обновляет target_auth.
        Ответ и секреты не сохраняются в audit/логи; для ответа запрещено кэширование.
      security:
        - ControlPanelBasicAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CredentialId'
      responses:
        '200':
          description: Игровые credentials указанного сервера и версии
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsResponse'
        '401':
          $ref: '#/components/responses/ControlUnauthorized'
        '404':
          $ref: '#/components/responses/ControlResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v2/runs/{run_id}/time/advance:
    post:
      tags: [Time]
      operationId: advanceTime
      summary: Явно прокрутить симуляционное время
      description: |
        `duration_seconds` должен быть не меньше 300. Фактическое продвижение равно
        `max(real_elapsed_since_previous_request, duration_seconds)`, если раньше не
        сработал `stop_when`. Условие `new_log_errors: 1` останавливает прокрутку на
        временной метке первой новой записи публичного лога с непустым `error`.
        Существовавшие до запроса ошибки не учитываются. События с одной временной
        меткой обрабатываются атомарно. Повтор с тем же `request_id` не продвигает
        время второй раз; `stop_when` входит в идемпотентный payload.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceTimeRequest'
            example:
              request_id: advance-20260824-001
              duration_seconds: 3600
              stop_when:
                new_log_errors: 1
      responses:
        '200':
          description: Время продвинуто, наступившие события обработаны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceTimeResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    ControlPanelBasicAuth:
      type: http
      scheme: basic
      description: |
        Игровой логин и пароль панели из control_panel_auth ответа POST /v2/start.
        Передавайте их в Authorization: Basic <base64(username:password)>.
        Не являются credentials конкретного сервера и не заменяют target_auth.
        Используются только на /control/commands и /credentials/{credential_id}.
        Секреты не записываются в audit, логи, ответы ошибок или operation.

  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      description: Неподбираемый буквенно-цифровой идентификатор запуска
      schema:
        $ref: '#/components/schemas/RunId'
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9]{16,64}$'
        examples: [8Mx2Qa7Pc4Vn9Rt5]
    CredentialId:
      name: credential_id
      in: path
      required: true
      description: Выданный идентификатор версии credentials в пределах текущего run
      schema:
        $ref: '#/components/schemas/ResourceId'
    From:
      name: from
      in: query
      description: Начало периода в симуляционном времени, включительно
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Конец периода в симуляционном времени, включительно
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      description: Непрозрачный cursor из предыдущего ответа
      schema:
        type: string
        maxLength: 512

  responses:
    InvalidRequest:
      description: Запрос не соответствует контракту или нарушает ограничения
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidSeed:
              value:
                error: INVALID_SEED
                message: Seed must be a non-zero integer
            minimumAdvance:
              value:
                error: MINIMUM_ADVANCE_IS_300_SECONDS
                message: duration_seconds must be at least 300
    RunNotFound:
      description: Run с таким ID не существует
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: RUN_NOT_FOUND
            message: Run does not exist
    Conflict:
      description: Конфликт состояния, конкурентный запрос или недопустимый порядок действий
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            concurrentRequest:
              value:
                error: CONCURRENT_RUN_REQUEST
                message: Another request is currently modifying this run
            runNotRunning:
              value:
                error: RUN_NOT_RUNNING
                message: The run is no longer running

    ControlUnauthorized:
      description: Отсутствует или неверен доступ к панели текущего run
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Basic realm="control"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: CONTROL_UNAUTHORIZED
            message: Control panel credentials are missing or invalid
    TargetUnauthorized:
      description: |
        Панель авторизована, но target_auth не даёт доступ к выбранному серверу.
        HTTP Basic повторно не запрашивается. Получите новые credentials из inbox
        или источника секретов и повторите команду с актуальным target_auth.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCredentials:
              value:
                error: TARGET_UNAUTHORIZED
                message: Target server credentials are invalid
            expiredCredentials:
              value:
                error: CREDENTIALS_EXPIRED
                message: Target server credentials have expired
    ControlInvalidRequest:
      description: Неизвестная команда, неверные параметры или несовместимый тип сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownCommand:
              value:
                error: INVALID_REQUEST
                message: Unknown control command
            invalidParameters:
              value:
                error: INVALID_REQUEST
                message: Command parameters do not match the schema
            roleMismatch:
              value:
                error: INVALID_REQUEST
                message: Instance type does not support the requested role
    ControlResourceNotFound:
      description: |
        Run или ресурс не найден в текущем run. Credentials из другого run,
        неизвестные и ещё не выданные версии возвращают одинаковую ошибку
        RESOURCE_NOT_FOUND без раскрытия существования секрета.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            resource:
              value:
                error: RESOURCE_NOT_FOUND
                message: Resource does not exist or is not available in this run
            run:
              value:
                error: RUN_NOT_FOUND
                message: Run does not exist
    ControlConflict:
      description: |
        Действие недопустимо в текущем состоянии. Ошибка не меняет состояние.
        Возможны IDEMPOTENCY_CONFLICT, LAST_BACKEND_REQUIRED, SERVER_IN_USE,
        SITE_NOT_STOPPED, SITE_CONFIG_CONFLICT, DB_NOT_EMPTY, DB_NOT_READY,
        DB_BACKUP_STALE, BACKUP_NOT_READY, BACKEND_UNAVAILABLE, OPERATION_IN_PROGRESS,
        INSUFFICIENT_DISK_SPACE, CONCURRENT_RUN_REQUEST и RUN_NOT_RUNNING.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            lastBackend:
              value:
                error: LAST_BACKEND_REQUIRED
                message: The last backend server cannot be deleted
            siteNotStopped:
              value:
                error: SITE_NOT_STOPPED
                message: Wait for site.stop to succeed before this operation
            configurationChanged:
              value:
                error: SITE_CONFIG_CONFLICT
                message: Current database does not match expected_current_database_id
            idempotency:
              value:
                error: IDEMPOTENCY_CONFLICT
                message: request_id was already used with another command or params
    ControlTargetUnavailable:
      description: |
        Целевой сервер или БД недоступны, например SERVER_UNAVAILABLE,
        DB_UNAVAILABLE или DISK_FULL. disk.usage и disk.cleanup остаются доступны
        при DISK_FULL через панель; ошибка страницы не отключает управление.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: DISK_FULL
            message: Target server has no free disk space

  schemas:
    RunId:
      type: string
      description: Криптографически случайный base62 ID; не является хешем seed
      pattern: '^[A-Za-z0-9]{20,64}$'
      examples: [7Kp3mN8qR2vX5cL9tF4a]

    RequestId:
      type: string
      description: Идемпотентный ID, уникальный в пределах агента или run
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
      examples: [request-20260824-001]

    ProductId:
      type: string
      description: Стабильный идентификатор товара в пределах мира
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
      examples: [product-001]

    MessageId:
      type: string
      description: Стабильный идентификатор сообщения inbox в пределах мира
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
      examples: [control-access-001]

    AgentId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
      examples: [sre-agent]

    AgentVersion:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$'
      examples: [3.2.0]

    PageType:
      type: string
      enum:
        - product_list
        - product_page

    RunStatus:
      type: string
      enum: [running, completed, failed]

    SiteStatus:
      type: string
      enum: [healthy, degraded, unavailable]

    OperationStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    Clock:
      type: object
      additionalProperties: false
      required:
        - simulation_time
        - simulation_ends_at
        - remaining_seconds
        - real_elapsed_seconds
        - applied_advance_seconds
      properties:
        simulation_time:
          type: string
          format: date-time
          description: Текущее симуляционное время после автоматического продвижения
        simulation_ends_at:
          type: string
          format: date-time
          description: Максимальный момент времени, до которого работает этот run
        remaining_seconds:
          type: number
          minimum: 0
          description: Сколько симуляционных секунд осталось до завершения run
        real_elapsed_seconds:
          type: number
          minimum: 0
          description: Реальное время с предыдущего вызова этого run
        applied_advance_seconds:
          type: number
          minimum: 0
          description: Фактическое продвижение симуляции перед выполнением запроса

    TimeWindow:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time

    StartRunRequest:
      type: object
      additionalProperties: false
      required: [seed, agent_id, agent_version, request_id]
      properties:
        seed:
          type: integer
          not:
            const: 0
          description: Отрицательный — ручной мир; положительный — генерируемый мир
        agent_id:
          $ref: '#/components/schemas/AgentId'
        agent_version:
          $ref: '#/components/schemas/AgentVersion'
        request_id:
          $ref: '#/components/schemas/RequestId'

    StartRunResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - seed
        - agent_id
        - agent_version
        - status
        - simulation_time
        - simulation_ends_at
        - commands_markdown
        - control_panel_auth
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        seed:
          type: integer
        agent_id:
          $ref: '#/components/schemas/AgentId'
        agent_version:
          $ref: '#/components/schemas/AgentVersion'
        status:
          $ref: '#/components/schemas/RunStatus'
        simulation_time:
          type: string
          format: date-time
        simulation_ends_at:
          type: string
          format: date-time

        commands_markdown:
          type: string
          minLength: 1
          contentMediaType: text/markdown
          description: Полный неизменённый текст COMMANDS.md, встроенный в текущую сборку сервера
        control_panel_auth:
          $ref: '#/components/schemas/ControlPanelAuth'

    ControlPanelAuth:
      type: object
      additionalProperties: false
      required: [scheme, username, password, instructions]
      description: |
        Выдаваемый при старте доступ к панели текущего run. Сохраняется при
        идемпотентном повторе и перезапуске сервера; не является target_auth.
        Передавайте через HTTPS и не сохраняйте в публичных логах.
      properties:
        scheme:
          type: string
          const: basic
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        instructions:
          type: string
          minLength: 1
          description: Инструкция передавать HTTP Basic Auth на путях панели и источника credentials этого run

    AvailabilitySummary:
      type: object
      additionalProperties: false
      required: [uptime_target, observed_seconds, available_seconds, downtime_seconds, uptime_ratio, slo_passed]
      description: |
        Доступность по времени с начала run. observed_seconds = available_seconds +
        downtime_seconds; uptime_ratio = available_seconds / observed_seconds.
        Учитываются интервалы состояния сервиса, даже если в них нет запросов.
        Критерий доступности — успех всех эталонных read-only проверок легитимного
        доступа через firewall, backend и БД без дополнительной нагрузки.
        Ручные probes не могут увеличивать числитель этой формулы.
      allOf:
        - if:
            properties:
              observed_seconds:
                const: 0
          then:
            properties:
              available_seconds:
                const: 0
              downtime_seconds:
                const: 0
              uptime_ratio:
                type: 'null'
          else:
            properties:
              uptime_ratio:
                type: number
      properties:
        uptime_target:
          type: number
          const: 0.99
          description: Неизменяемый порог SLO; сравнивается без округления
        observed_seconds:
          type: number
          minimum: 0
          description: Симуляционное время от начала run до текущего момента или его завершения
        available_seconds:
          type: number
          minimum: 0
        downtime_seconds:
          type: number
          minimum: 0
          description: Включает плановую остановку сайта и недоступность легитимного доступа
        uptime_ratio:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Доля времени доступности; null при observed_seconds=0
        slo_passed:
          type: [boolean, 'null']
          description: null для running; для completed — uptime_ratio >= 0.99; для failed — false

    CostSummary:
      type: object
      additionalProperties: false
      required: [currency, server_cost_minor, backup_storage_cost_minor, total_cost_minor, current_cost_per_hour_minor]
      description: |
        Расходы в минимальных единицах валюты мира. total_cost_minor =
        server_cost_minor + backup_storage_cost_minor. Уже начисленные расходы
        не уменьшаются при удалении сервера. Начисления идут и при остановленном
        сайте; отдельного дохода, бюджета или денежного баланса нет.
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: [USD]
        server_cost_minor:
          type: integer
          minimum: 0
          description: Суммарные расходы на backend- и database-серверы с начала run
        backup_storage_cost_minor:
          type: integer
          minimum: 0
          description: Суммарные расходы на внешнее хранение бэкапов с начала run
        total_cost_minor:
          type: integer
          minimum: 0
          description: Минимизируемая стоимость полного run при соблюдении uptime SLO
        current_cost_per_hour_minor:
          type: integer
          minimum: 0
          description: Текущая суммарная ставка выделенных серверов и хранения бэкапов за симуляционный час

    OverviewResponse:
      type: object
      additionalProperties: false
      required: [clock, run_id, status, site_status, server_count, capacity_utilization, error_rate, availability, costs]
      allOf:
        - if:
            properties:
              status:
                const: running
          then:
            properties:
              availability:
                properties:
                  slo_passed:
                    type: 'null'
        - if:
            properties:
              status:
                const: failed
          then:
            properties:
              availability:
                properties:
                  slo_passed:
                    const: false
        - if:
            properties:
              status:
                const: completed
          then:
            properties:
              availability:
                allOf:
                  - if:
                      properties:
                        uptime_ratio:
                          type: number
                          minimum: 0.99
                    then:
                      properties:
                        slo_passed:
                          const: true
                    else:
                      properties:
                        slo_passed:
                          const: false
      properties:
        clock:
          $ref: '#/components/schemas/Clock'
        run_id:
          $ref: '#/components/schemas/RunId'
        status:
          $ref: '#/components/schemas/RunStatus'
        site_status:
          $ref: '#/components/schemas/SiteStatus'
        server_count:
          type: integer
          minimum: 0
        capacity_utilization:
          type: number
          minimum: 0
        error_rate:
          type: number
          minimum: 0
          maximum: 1
          description: Диагностическая доля ошибок запросов, отдельно от uptime
        availability:
          $ref: '#/components/schemas/AvailabilitySummary'
        costs:
          $ref: '#/components/schemas/CostSummary'
      examples:
        - clock:
            simulation_time: '2033-03-01T01:00:00Z'
            simulation_ends_at: '2033-04-01T00:00:00Z'
            remaining_seconds: 2674800
            real_elapsed_seconds: 10
            applied_advance_seconds: 10
          run_id: 7Kp3mN8qR2vX5cL9tF4a
          status: running
          site_status: healthy
          server_count: 2
